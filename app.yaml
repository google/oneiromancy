# app.yaml - Google App Engine Static Hosting Configuration
# Project: "Oneiromancy" Fantasy Football Draft Assistant
runtime: nodejs22
instance_class: F2

automatic_scaling:
  min_idle_instances: 0
  max_instances: 5
  target_cpu_utilization: 0.65

env_variables:
  NODE_ENV: "production"
  PORT: "8080"
  NEXT_TELEMETRY_DISABLED: "1"

handlers:
  # Route static compiled CSS and JS chunks directly via App Engine CDN edge
  - url: /_next
    static_dir: out/_next
    secure: always

  # Route public static assets (icons, images, manifest, robots.txt)
  - url: /(.*\.(js|css|png|jpg|jpeg|gif|ico|svg|json|woff|woff2|txt|xml|html))$
    static_files: out/\1
    upload: out/.*
    secure: always

  # Route all client-side HTML pages and SPA fallback to out/index.html
  - url: /.*
    static_files: out/index.html
    upload: out/index.html
    secure: always
